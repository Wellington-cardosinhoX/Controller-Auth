<div style="font-family: sans-serif; max-width: 500px; margin: 40px auto; text-align: center;">
  <h1>{{ title() }}</h1>

  <h2>Teste de conexão com a API</h2>

  @if (apiErro()) {
    <p style="color: red;">{{ apiErro() }}</p>
  } @else {
    <p>Status: <strong>{{ apiStatus() }}</strong></p>
    <p>Horário da API: {{ apiHorario() }}</p>
  }

  <button (click)="testarApi()">Testar novamente</button>
</div>
